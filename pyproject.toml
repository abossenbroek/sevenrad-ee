[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "sevenrad-ee"
version = "0.1.0"
description = "A Python application for performing Google Earth Engine computations using modern Python 3.12"
authors = [
    {name = "Anton Bossenbroek"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "earthengine-api~=1.1.0",
    "google-auth~=2.37.0",
    "google-cloud-storage~=2.19.0",
    "rich~=13.9.0",
    "typer~=0.9.0",
    "pydantic~=2.5.0",
    "pydantic-settings~=2.1.0",
    "python-dotenv~=1.0.0",
    "googlemaps~=4.10.0",
    "pyyaml~=6.0.0",
    "requests~=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.3.0",
    "pytest-cov~=4.1.0",
    "vcrpy~=5.1.0",
    "pytest-vcr~=1.0.2",
    "ruff~=0.8.0",
    "mypy~=1.13.0",
    "pre-commit~=4.0.0",
]

[project.scripts]
viirs-top-polluters = "sevenrad_ee.top_polluters.cli:app"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src/sevenrad_ee", "tests"]

[tool.ruff.lint]
select = [
    "D",      # pydocstyle
    "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107",
    "S",      # flake8-bandit (security)
    "B",      # flake8-bugbear
    "F403",   # undefined local with import star
    "ANN",    # flake8-annotations
    "G",      # flake8-logging-format
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "I",      # isort
    "C90",    # mccabe complexity
    "PD",     # pandas-vet
    "N",      # pep8-naming
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "PLE",    # pylint errors
    "PLR",    # pylint refactor
    "RUF",    # ruff-specific rules
]
ignore = [
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D212",   # multi-line-summary-first-line (conflicts with D213)
]

[tool.ruff.lint.per-file-ignores]
"src/sevenrad_ee/top_polluters/cli.py" = ["B008"]  # Typer CLI pattern
"src/sevenrad_ee/operations/generate_viirs_maps.py" = ["B008"]  # Typer CLI pattern

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"

[[tool.mypy.overrides]]
module = "ee"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "googlemaps"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
